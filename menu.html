<!DOCTYPE html>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

<body class="menu-body">

<main class="menu-page-main">


<section class="menu-page-hero">

<section class="menu-gallery">

    <div class="container">

        <div class="menu-grid">


            <button class="menu-image"

                    type="button">

                <img src="images/menu-3.jpg"

            </button>


            <button class="menu-image"
                    type="button">

                <img src="images/menu-4.jpg"

            </button>


        </div>

    </div>

</main>


<!-- FULLSCREEN VIEWER -->

     id="imageViewer">


    <button class="viewer-close"

            aria-label="Закрыть">
    </button>

            id="viewerPrev"
            aria-label="Предыдущая страница">
    </button>


    <img class="viewer-image"
         id="viewerImage"
         src=""
         alt="">


    <button class="viewer-nav viewer-next"

            aria-label="Следующая страница">
